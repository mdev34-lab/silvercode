name: publish
run-name: "${{ inputs.dry_run && 'dry-run ' || '' }}release"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute version + notes only; create nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mdev34-lab'
    steps:
      - name: Only release from dev
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/dev' }}
        run: |
          echo "::error::Releases can only be cut from dev (use dry_run elsewhere)"
          exit 1
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Check package metadata
        run: ./script/release-check.ts
      - id: version
        run: ./script/version.ts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.version.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build:
    needs: version
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # Build the exact tag, not the moving branch, so the artifacts are reproducible.
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Check tag against package metadata
        run: ./script/release-check.ts --tag "${{ needs.version.outputs.tag }}"
      - name: Build all targets and upload archives to the draft release
        run: ./packages/opencode/script/build.ts
        env:
          SILVERCODE_VERSION: ${{ needs.version.outputs.version }}
          SILVERCODE_RELEASE: "1"
      - name: Attach install script
        run: gh release upload "${{ needs.version.outputs.tag }}" ./install --clobber

  finalize:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # Cleanup never deletes published releases; if a published release isn't latest, mark it latest manually.
      - run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest

  npm:
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # The launcher downloads the finished release, so it can only be published after finalize.
    needs: [version, finalize]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: ./.github/actions/setup-bun
      - name: Publish the launcher package to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          trap 'rm -f "$HOME/.npmrc"' EXIT
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          ./packages/opencode/script/publish.ts
        env:
          SILVERCODE_VERSION: ${{ needs.version.outputs.version }}
          SILVERCODE_RELEASE: "1"

  cleanup:
    # Wait for the entire publish path so cleanup sees build/finalize failures before evaluating the condition.
    needs: [version, build, finalize]
    if: ${{ always() && failure() && !inputs.dry_run && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: ./.github/actions/setup-bun
      # Removes a leftover draft release and its tag, or an orphan tag pushed
      # before the draft existed. Never touches a published release.
      - name: Delete leftover draft and orphan tag (never a published release)
        run: ./script/release-cleanup.ts "${{ needs.version.outputs.tag }}"
